{% extends "base.html" %}
{% block title %}创建订单 · 花语小店{% endblock %}
{% block content %}
<section class="card narrow">
    <div class="card-header">
        <h2>创建订单</h2>
        <a class="btn btn-link" href="{{ url_for('order_list') }}">← 返回订单</a>
    </div>

    {% if not customers %}
        <p class="empty-state">请先<a href="{{ url_for('customer_add') }}">添加客户</a>。</p>
    {% elif not flowers %}
        <p class="empty-state">当前没有可售鲜花，请先<a href="{{ url_for('flower_add') }}">上架鲜花</a>并补充库存。</p>
    {% else %}
        <form method="post" class="form">
            <label>
                <span>客户 *</span>
                <select name="customer_id" required>
                    <option value="">请选择客户</option>
                    {% for customer in customers %}
                        <option value="{{ customer.id }}">{{ customer.name }}（{{ customer.phone }}）</option>
                    {% endfor %}
                </select>
            </label>
            <label>
                <span>鲜花 *</span>
                <select name="flower_id" required>
                    <option value="">请选择鲜花</option>
                    {% for flower in flowers %}
                        <option value="{{ flower.id }}">
                            {{ flower.name }} · 库存 {{ flower.stock }} · {{ format_currency(flower.price) }}
                        </option>
                    {% endfor %}
                </select>
            </label>
            <label>
                <span>购买数量 *</span>
                <input type="number" name="quantity" step="1" min="1" required placeholder="例如：3">
            </label>
            <p class="form-hint">提交后将自动校验库存并扣减库存数量。</p>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">提交订单</button>
                <a class="btn btn-secondary" href="{{ url_for('order_list') }}">取消</a>
            </div>
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        </form>
    {% endif %}
</section>
{% endblock %}
